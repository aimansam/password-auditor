[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-auditor"
version = "1.0.0"
description = "Local password-strength and breach-exposure auditor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests"]

[project.scripts]
password-auditor = "auditor:main"

[tool.setuptools]
py-modules = ["auditor"]
